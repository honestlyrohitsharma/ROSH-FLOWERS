<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ROSH • Fresh Flowers Delivered</title>
    <meta name="description" content="ROSH — Fresh flowers delivered in Ranchi." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="container header-bar">
        <div class="brand">
          <a href="/index.html" class="brand-link" aria-label="ROSH Home">
            <span class="brand-topline" aria-hidden="true"></span>
            <span class="brand-name">ROSH</span>
            <span class="brand-underline" aria-hidden="true"></span>
          </a>
        </div>
        
        <div class="search-container">
            <form id="search-form">
                <input id="search-input" type="search" placeholder="Search for flowers...">
            </form>
        </div>

        <nav class="main-nav" aria-label="Primary">
          <ul id="user-nav">
            <li><button id="login-btn" class="btn">Login with Google</button></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="content" class="container site-main">
      <section class="section-heading" aria-labelledby="cat-title">
        <h2 id="cat-title" class="text-balance">Our Flower Collections</h2>
        
        <div class="chips" role="tablist" aria-label="Filter products by category">
            <button class="chip is-active" role="tab" aria-selected="true" data-filter="all">All Flowers</button>
            <button class="chip" role="tab" aria-selected="false" data-filter="Bouquets">Bouquets</button>
            <button class="chip" role="tab" aria-selected="false" data-filter="Potted Plants">Potted Plants</button>
            <button class="chip" role="tab" aria-selected="false" data-filter="Anniversary">For Anniversaries</button>
        </div>
      </section>

      <div class="layout">
        <section class="products" aria-label="Products grid">
          <p>Loading flowers...</p>
        </section>

        <aside class="sidebar" aria-label="Updates and reviews">
          <section class="panel">
            <h3 class="panel-title">
              New items listed
              <span class="panel-underline" aria-hidden="true"></span>
            </h3>
            <ul class="list">
              <li>Sunshine Lily Bouquets</li>
              <li>Royal Orchid Plants</li>
              <li>Classic Red Roses</li>
            </ul>
          </section>

          <section class="panel" id="reviews-panel">
            <h3 class="panel-title">Reviews</h3>
            <p>Loading reviews...</p>
          </section>

          <section class="panel" aria-labelledby="signup-title">
            <h3 id="signup-title" class="panel-title">Get updates</h3>
            <form id="signup-form" class="form" novalidate>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" required />
              <button class="btn btn-accent" type="submit">Subscribe</button>
            </form>
          </section>
        </aside>
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <p class="muted">© <span id="year">2025</span> ROSH • Made with care in India</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/script.js"></script>
  </body>
</html>
