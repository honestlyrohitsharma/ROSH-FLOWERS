<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Cart • ROSH</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="container header-bar">
        <div class="brand">
          <a href="/index.html" class="brand-link" aria-label="ROSH Home">
            <span class="brand-topline" aria-hidden="true"></span>
            <span class="brand-name">ROSH</span>
            <span class="brand-underline" aria-hidden="true"></span>
          </a>
        </div>
        <nav class="main-nav" aria-label="Primary">
           <ul>
               <li><a href="/index.html">Continue Shopping</a></li>
           </ul>
        </nav>
      </div>
    </header>

    <main id="content" class="container site-main">
        <section class="section-heading">
            <h2 id="cat-title">Your Shopping Cart</h2>
        </section>

        <div id="cart-items-container">
            <p>Loading your cart...</p>
        </div>

        <section class="panel" style="margin-top: 2rem;">
            <h3 class="panel-title">Checkout</h3>
            <div id="cart-summary">
                <p><strong>Total Price:</strong> <span id="total-price">₹0.00</span></p>
            </div>
            
            <form id="checkout-form" class="form">
                <div class="address-form-grid">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input id="full-name" type="text" placeholder="Your Name" required />
                    </div>
                    <div class="form-group">
                        <label for="phone-number">Phone Number</label>
                        <input id="phone-number" type="tel" placeholder="10-digit mobile number" required />
                    </div>
                    <div class="form-group full-width">
                        <label for="street-address">Street Address</label>
                        <input id="street-address" type="text" placeholder="House No, Building, Street" required />
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input id="city" type="text" placeholder="e.g., Ranchi" required />
                    </div>
                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input id="pincode" type="text" placeholder="6-digit pincode" required />
                    </div>
                </div>

                <p class="cod-notice">Payment Method: <strong>Cash on Delivery (COD)</strong></p>
                
                <button id="checkout-btn" class="btn btn-accent" type="submit" style="margin-top: 1.5rem;">Place COD Order</button>
                <p id="checkout-message" class="form-message" role="status"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <p class="muted">© <span id="year">2025</span> ROSH • Made with care in India</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/cart.js"></script>
  </body>
</html>
